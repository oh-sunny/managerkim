<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">프로젝트 서비스 연결 구조</title>
  <desc id="desc">운영자 브라우저와 Vercel, Supabase, Gemini API, Google Sheets의 연결을 네 가지 흐름으로 정리한 16대9 발표용 도식.</desc>
  <defs>
    <style>
      text { font-family: 'Malgun Gothic', '맑은 고딕', Arial, sans-serif; }
      .title { font-size: 54px; font-weight: 800; fill: #14233D; }
      .subtitle { font-size: 25px; fill: #52627A; }
      .row-title { font-size: 26px; font-weight: 750; fill: #243650; }
      .node-title { font-size: 28px; font-weight: 750; fill: #14233D; }
      .node-sub { font-size: 21px; fill: #51617A; }
      .note { font-size: 19px; fill: #52627A; }
      .arrow { fill: none; stroke: #7185A4; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6.5 L1 12" fill="none" stroke="#7185A4" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#1E355A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#F6F8FC"/>
  <rect x="0" y="0" width="1920" height="12" fill="#4D65D9"/>
  <text class="title" x="88" y="93">서비스 연결 구조</text>
  <text class="subtitle" x="90" y="144">운영자 화면에서 데이터와 AI가 오가는 경로</text>

  <!-- 1. Website -->
  <rect x="80" y="195" width="1760" height="165" rx="26" fill="#FFFFFF" filter="url(#softShadow)"/>
  <rect x="80" y="195" width="13" height="165" rx="6" fill="#4D65D9"/>
  <text class="row-title" x="120" y="252">01  화면 열기</text>
  <text class="note" x="120" y="289">웹사이트 표시</text>
  <rect x="438" y="223" width="390" height="110" rx="19" fill="#EEF1FF" stroke="#CBD2FF" stroke-width="2"/>
  <text class="node-title" x="633" y="269" text-anchor="middle">운영자 브라우저</text>
  <text class="node-sub" x="633" y="305" text-anchor="middle">사이트 접속</text>
  <path class="arrow" d="M846 278 H1010"/>
  <rect x="1050" y="223" width="650" height="110" rx="19" fill="#EEF1FF" stroke="#CBD2FF" stroke-width="2"/>
  <text class="node-title" x="1375" y="269" text-anchor="middle">Vercel 웹 서버</text>
  <text class="node-sub" x="1375" y="305" text-anchor="middle">화면 파일 제공</text>

  <!-- 2. Account and data -->
  <rect x="80" y="380" width="1760" height="165" rx="26" fill="#FFFFFF" filter="url(#softShadow)"/>
  <rect x="80" y="380" width="13" height="165" rx="6" fill="#19A58B"/>
  <text class="row-title" x="120" y="437">02  로그인·저장</text>
  <text class="note" x="120" y="474">계정별 자료 보관</text>
  <rect x="438" y="408" width="390" height="110" rx="19" fill="#E9F8F4" stroke="#B9E6DA" stroke-width="2"/>
  <text class="node-title" x="633" y="454" text-anchor="middle">운영자 브라우저</text>
  <text class="node-sub" x="633" y="490" text-anchor="middle">로그인·정보 저장</text>
  <path class="arrow" d="M846 463 H1010"/>
  <rect x="1050" y="408" width="650" height="110" rx="19" fill="#E9F8F4" stroke="#B9E6DA" stroke-width="2"/>
  <text class="node-title" x="1375" y="454" text-anchor="middle">Supabase</text>
  <text class="node-sub" x="1375" y="490" text-anchor="middle">인증 · DB · 비공개 파일 저장소</text>

  <!-- 3. Gemini -->
  <rect x="80" y="565" width="1760" height="165" rx="26" fill="#FFFFFF" filter="url(#softShadow)"/>
  <rect x="80" y="565" width="13" height="165" rx="6" fill="#9865CF"/>
  <text class="row-title" x="120" y="622">03  AI 작업</text>
  <text class="note" x="120" y="659">분석·공지 초안</text>
  <rect x="370" y="593" width="318" height="110" rx="19" fill="#F4EDFC" stroke="#DBC8EF" stroke-width="2"/>
  <text class="node-title" x="529" y="639" text-anchor="middle">운영자 브라우저</text>
  <text class="node-sub" x="529" y="675" text-anchor="middle">작업 요청</text>
  <path class="arrow" d="M706 648 H777"/>
  <rect x="816" y="593" width="360" height="110" rx="19" fill="#F4EDFC" stroke="#DBC8EF" stroke-width="2"/>
  <text class="node-title" x="996" y="639" text-anchor="middle">Vercel 서버 API</text>
  <text class="node-sub" x="996" y="675" text-anchor="middle">문서 처리·AI 호출</text>
  <path class="arrow" d="M1194 648 H1264"/>
  <rect x="1304" y="593" width="396" height="110" rx="19" fill="#F4EDFC" stroke="#DBC8EF" stroke-width="2"/>
  <text class="node-title" x="1502" y="639" text-anchor="middle">Gemini API</text>
  <text class="node-sub" x="1502" y="675" text-anchor="middle">분석 결과·초안 반환</text>

  <!-- 4. Sheets sync -->
  <rect x="80" y="750" width="1760" height="195" rx="26" fill="#FFFFFF" filter="url(#softShadow)"/>
  <rect x="80" y="750" width="13" height="195" rx="6" fill="#E2A33C"/>
  <text class="row-title" x="120" y="807">04  신청 현황</text>
  <text class="note" x="120" y="844">수동·매시간 조회</text>
  <rect x="356" y="778" width="300" height="110" rx="19" fill="#FFF6E6" stroke="#F0D9A8" stroke-width="2"/>
  <text class="node-title" x="506" y="824" text-anchor="middle">운영자 / Cron</text>
  <text class="node-sub" x="506" y="860" text-anchor="middle">가져오기 실행</text>
  <path class="arrow" d="M674 833 H710"/>
  <rect x="749" y="778" width="320" height="110" rx="19" fill="#FFF6E6" stroke="#F0D9A8" stroke-width="2"/>
  <text class="node-title" x="909" y="824" text-anchor="middle">Supabase 서버 함수</text>
  <text class="node-sub" x="909" y="860" text-anchor="middle">원본 조회·결과 저장</text>
  <path class="arrow" d="M1087 833 H1120"/>
  <rect x="1159" y="778" width="245" height="110" rx="19" fill="#FFF6E6" stroke="#F0D9A8" stroke-width="2"/>
  <text class="node-title" x="1281" y="824" text-anchor="middle">Google Sheets</text>
  <text class="node-sub" x="1281" y="860" text-anchor="middle">신청 원본</text>
  <path class="arrow" d="M1422 833 H1451"/>
  <rect x="1490" y="778" width="210" height="110" rx="19" fill="#FFF6E6" stroke="#F0D9A8" stroke-width="2"/>
  <text class="node-title" x="1595" y="824" text-anchor="middle">Supabase DB</text>
  <text class="node-sub" x="1595" y="860" text-anchor="middle">현황·티켓 기록</text>
  <text class="note" x="749" y="920">※ Google Sheets를 읽고 DB에 기록하는 주체는 Supabase 서버 함수입니다.</text>

  <text class="note" x="90" y="1007">현재 상태: 실제 Slack 발송은 아직 연결되지 않았습니다.</text>
  <text class="note" x="1830" y="1007" text-anchor="end">발표용 개념도 · 2026.10</text>
</svg>
