<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">행사 안내 운영 도구의 데이터 흐름과 API 구조</title>
  <desc id="desc">첫째 줄은 Google Sheets API에서 Supabase Edge Function과 데이터베이스를 거쳐 운영자 화면으로 이어지는 신청 현황 경로다. 둘째 줄은 운영자 화면에서 Vercel 서버 API와 Gemini API를 거쳐 초안을 검토하고 저장하는 경로다.</desc>
  <defs>
    <style>
      text { font-family: 'Malgun Gothic', 'Pretendard', 'Noto Sans KR', Arial, sans-serif; }
      .title { fill:#14233e; font-size:42px; font-weight:800; }
      .subtitle { fill:#5e6d82; font-size:19px; }
      .lane-title { fill:#193252; font-size:23px; font-weight:800; }
      .lane-note { fill:#63738a; font-size:16px; }
      .card-title { fill:#18304e; font-size:21px; font-weight:800; }
      .card-sub { fill:#526680; font-size:16px; }
      .arrow-label { fill:#61728a; font-size:14px; font-weight:700; }
      .foot { fill:#576a82; font-size:16px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6a7f9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#243c64" flood-opacity="0.07"/></filter>
  </defs>

  <rect width="1600" height="900" fill="#f6f8fc"/>
  <rect width="1600" height="9" fill="#5267dc"/>
  <text x="70" y="76" class="title">데이터 흐름과 API 구조</text>
  <text x="72" y="112" class="subtitle">신청 현황은 Sheets에서, 공지 초안은 Gemini에서 — 담당자는 웹 화면에서 확인합니다</text>

  <!-- 신청 현황 경로 -->
  <rect x="58" y="153" width="1484" height="292" rx="27" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="58" y="153" width="9" height="292" rx="4" fill="#169c85"/>
  <circle cx="99" cy="197" r="18" fill="#dcf7ef"/>
  <text x="99" y="203" text-anchor="middle" fill="#08735f" font-size="15" font-weight="800">1</text>
  <text x="130" y="205" class="lane-title">신청 현황 · 안내 티켓</text>
  <text x="535" y="203" class="lane-note">신청 원본을 읽고, 계산한 결과를 담당자에게 보여줍니다</text>

  <rect x="88" y="245" width="310" height="146" rx="19" fill="#eaf8f5" stroke="#a9e2d4" stroke-width="2"/>
  <text x="243" y="288" text-anchor="middle" class="card-title">Google Sheets API</text>
  <text x="243" y="327" text-anchor="middle" class="card-sub">직원·대상·신청이력</text>
  <text x="243" y="354" text-anchor="middle" class="card-sub">읽기 전용 원본</text>

  <rect x="465" y="245" width="310" height="146" rx="19" fill="#eaf8f5" stroke="#a9e2d4" stroke-width="2"/>
  <text x="620" y="286" text-anchor="middle" class="card-title">Supabase 서버 함수</text>
  <text x="620" y="327" text-anchor="middle" class="card-sub">시트 조회·데이터 검증</text>
  <text x="620" y="354" text-anchor="middle" class="card-sub">현황 정리·티켓 평가</text>

  <rect x="842" y="245" width="310" height="146" rx="19" fill="#eaf8f5" stroke="#a9e2d4" stroke-width="2"/>
  <text x="997" y="286" text-anchor="middle" class="card-title">Supabase</text>
  <text x="997" y="327" text-anchor="middle" class="card-sub">인증 · DB · 파일 저장소</text>
  <text x="997" y="354" text-anchor="middle" class="card-sub">프로젝트·현황·초안·기록</text>

  <rect x="1219" y="245" width="310" height="146" rx="19" fill="#eaf8f5" stroke="#a9e2d4" stroke-width="2"/>
  <text x="1374" y="286" text-anchor="middle" class="card-title">운영자 웹 화면</text>
  <text x="1374" y="327" text-anchor="middle" class="card-sub">현황·대상·티켓 확인</text>
  <text x="1374" y="354" text-anchor="middle" class="card-sub">Vercel에서 화면 제공</text>

  <path d="M405 318 H451" stroke="#6a7f9c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="428" y="292" text-anchor="middle" class="arrow-label">조회</text>
  <path d="M782 318 H828" stroke="#6a7f9c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="805" y="292" text-anchor="middle" class="arrow-label">저장</text>
  <path d="M1164 318 H1205" stroke="#6a7f9c" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1185" y="292" text-anchor="middle" class="arrow-label">조회·저장</text>
  <text x="91" y="423" class="lane-note">※ 수동 새로고침 또는 예약 실행이 Supabase 서버 함수를 호출합니다. Sheets가 DB에 직접 쓰지는 않습니다.</text>

  <!-- 문서와 AI 경로 -->
  <rect x="58" y="473" width="1484" height="292" rx="27" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="58" y="473" width="9" height="292" rx="4" fill="#8060ce"/>
  <circle cx="99" cy="517" r="18" fill="#f0e9fc"/>
  <text x="99" y="523" text-anchor="middle" fill="#6741a9" font-size="15" font-weight="800">2</text>
  <text x="130" y="525" class="lane-title">자료 분석 · 공지 초안</text>
  <text x="535" y="523" class="lane-note">AI 결과는 초안으로 돌아오며, 담당자가 확인한 뒤 저장합니다</text>

  <rect x="88" y="565" width="310" height="146" rx="19" fill="#f3edfc" stroke="#dac5f3" stroke-width="2"/>
  <text x="243" y="607" text-anchor="middle" class="card-title">운영자 웹 화면</text>
  <text x="243" y="648" text-anchor="middle" class="card-sub">자료·확정 정보 입력</text>
  <text x="243" y="675" text-anchor="middle" class="card-sub">초안 생성 요청</text>

  <rect x="465" y="565" width="310" height="146" rx="19" fill="#f3edfc" stroke="#dac5f3" stroke-width="2"/>
  <text x="620" y="607" text-anchor="middle" class="card-title">Vercel 서버 API</text>
  <text x="620" y="648" text-anchor="middle" class="card-sub">문서 추출·요청 검사</text>
  <text x="620" y="675" text-anchor="middle" class="card-sub">Gemini 호출</text>

  <rect x="842" y="565" width="310" height="146" rx="19" fill="#f3edfc" stroke="#dac5f3" stroke-width="2"/>
  <text x="997" y="607" text-anchor="middle" class="card-title">Gemini API</text>
  <text x="997" y="648" text-anchor="middle" class="card-sub">운영 자료의 정보 후보</text>
  <text x="997" y="675" text-anchor="middle" class="card-sub">공지 문구 초안 생성</text>

  <rect x="1219" y="565" width="310" height="146" rx="19" fill="#f3edfc" stroke="#dac5f3" stroke-width="2"/>
  <text x="1374" y="607" text-anchor="middle" class="card-title">담당자 검토·저장</text>
  <text x="1374" y="648" text-anchor="middle" class="card-sub">본문·대상·자료 확인</text>
  <text x="1374" y="675" text-anchor="middle" class="card-sub">확인 후 Supabase에 저장</text>

  <path d="M405 638 H451" stroke="#6a7f9c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="428" y="613" text-anchor="middle" class="arrow-label">요청</text>
  <path d="M787 638 H827" stroke="#6a7f9c" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="807" y="613" text-anchor="middle" class="arrow-label">요청·응답</text>
  <path d="M1159 638 H1205" stroke="#6a7f9c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1182" y="613" text-anchor="middle" class="arrow-label">서버 경유</text>
  <text x="91" y="743" class="lane-note">※ Gemini가 DB에 직접 저장하거나 Slack으로 전송하지 않습니다. 생성된 문구는 담당자가 검토합니다.</text>

  <rect x="58" y="798" width="1484" height="55" rx="14" fill="#e9eef8"/>
  <text x="84" y="833" class="foot">현재 범위: 화면·저장·규칙 티켓·AI 초안·모의 발송 기록  /  실제 Slack 발송은 아직 구현되지 않았습니다.</text>
</svg>
